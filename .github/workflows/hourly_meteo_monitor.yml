name: Monitoraggio e Archiviazione Agrometeo Oraria (CFR Toscana)

on:
  workflow_dispatch: # Avviato con precisione al minuto :30 via API da cron-job.org (o manualmente)

permissions:
  contents: write

jobs:
  update-meteo-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installazione dipendenze minime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione scarico telemetrico CFR e aggiornamento archivio
        run: |
          python scripts/update_data.py

      - name: Commit e Push automatico dei dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-aggiornamento agrometeo orario [skip ci]" && git push)

